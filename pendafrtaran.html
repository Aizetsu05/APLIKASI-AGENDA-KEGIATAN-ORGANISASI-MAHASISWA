<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daftar</title>

  <!-- Bootstrap 5 & Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

  <!-- CSS kustom -->
  <link href="pendafrtaran.css" rel="stylesheet">
</head>
<body>

  <main class="auth-wrapper">
    <div class="auth-card">

      <!-- LOGO -->
      <div class="auth-logo">
        <img src="WhatsApp Image 2026-10-20 at 18.41.41.jpeg" alt="Logo" class="img-fluid">
      </div>

      <h2 class="text-center fw-bold mb-4">
        <i class="fas fa-user-plus me-2"></i>Daftar
      </h2>

      <form action="proses_daftar.php" method="post" novalidate>

        <div class="mb-3">
          <label for="nama" class="form-label">Nama Lengkap</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-id-card"></i></span>
            <input type="text" class="form-control" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>
          </div>
        </div>

        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-user"></i></span>
            <input type="text" class="form-control" id="username" name="username" placeholder="Masukkan username" required>
          </div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
            <input type="email" class="form-control" id="email" name="email" placeholder="Masukkan email" required>
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            <input type="password" class="form-control" id="password" name="password" placeholder="Masukkan password" required>
            <button class="btn btn-toggle" type="button" id="togglePassword" aria-label="Tampilkan password">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="mb-3">
          <label for="konfirmasi" class="form-label">Konfirmasi Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            <input type="password" class="form-control" id="konfirmasi" name="konfirmasi" placeholder="Ulangi password" required>
          </div>
          <div class="form-text text-danger d-none" id="pesanPassword">Password tidak sama.</div>
        </div>

        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="setuju" required>
          <label class="form-check-label" for="setuju">Saya setuju dengan syarat &amp; ketentuan</label>
        </div>

        <button type="submit" class="btn btn-primary w-100">
          <i class="fas fa-user-plus me-2"></i>Daftar
        </button>
      </form>

      <p class="text-center mt-4 mb-0">
        Sudah punya akun? <a href="login.HTML">Masuk</a>
      </p>
    </div>
  </main>



</body>
</html>
