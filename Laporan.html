<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laporan – Agenda Kegiatan Organisasi Mahasiswa</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
  :root{--hijau:#06e8a0;--hijau-tua:#0a7d58;--abu:#ececec}
  body{background:#f4f6f7}
  .topbar{background:var(--hijau);min-height:64px}
  .topbar .brand{font-weight:700;color:#000;text-decoration:none;font-size:1.15rem}
  .topbar .logo{width:40px;height:40px;border-radius:50%;background:#fff;border:2px solid var(--hijau-tua);display:inline-flex;align-items:center;justify-content:center;color:var(--hijau-tua)}
  .sidebar{background:var(--hijau);min-height:calc(100vh - 64px)}
  .sidebar .judul{font-weight:700;font-size:1.15rem;padding:1rem 1rem .5rem}
  .sidebar .nav-link{color:#000;padding:.7rem 1rem;margin:.15rem .5rem;border-radius:.4rem;display:flex;gap:.75rem;align-items:center}
  .sidebar .nav-link:hover{background:rgba(255,255,255,.35)}
  .sidebar .nav-link.active{background:var(--hijau-tua);color:#fff;font-weight:600}
  .sidebar .nav-link:focus-visible,.btn:focus-visible{outline:3px solid #f2b84b;outline-offset:2px}
  h1.judul-halaman{font-size:1.9rem;font-weight:700;margin-bottom:.25rem}
  .form-label{font-weight:600;font-size:.85rem;margin-bottom:.2rem}
  .tabel-rekap{background:#fff;font-size:.95rem}
  .tabel-rekap thead th{background:#e4e7e8}
  .tabel-rekap tfoot td{font-weight:700;background:#f1f3f4}
  .tabel-rekap td:last-child,.tabel-rekap th:last-child{width:35%}
  @media print{.topbar,.sidebar,.form-filter,.no-print{display:none!important}main{width:100%!important}}
</style>
</head>
<body>

<!-- ============ HEADER ============ -->


<div class="container-fluid">
<div class="row">

  <!-- ============ SIDEBAR ============ -->


  <!-- ============ KONTEN LAPORAN ============ -->
  <main class="col-lg-10 p-3 p-md-4">
    <h1 class="judul-halaman">Laporan</h1>

    <form class="form-filter row g-3 align-items-end mb-4" id="formFilter">
      <div class="col-sm-6 col-md-3 col-xl-2">
        <label class="form-label" for="mulai">Periode Mulai</label>
        <input type="date" class="form-control" id="mulai">
      </div>
      <div class="col-sm-6 col-md-3 col-xl-2">
        <label class="form-label" for="selesai">Periode Selesai</label>
        <input type="date" class="form-control" id="selesai">
      </div>
      <div class="col-sm-6 col-md-3 col-xl-2">
        <label class="form-label" for="kategori">Kategori</label>
        <select class="form-select" id="kategori">
          <option value="">Semua Kategori</option>
          <option>Rapat</option><option>Seminar</option><option>Pelatihan</option><option>Lomba</option><option>Pelatihan</option>
        </select>
      </div>
      <div class="col-sm-6 col-md-3 col-xl-2 d-flex gap-2">
        <button type="submit" class="btn btn-secondary flex-fill">Tampilkan</button>
        <button type="button" class="btn btn-outline-secondary" id="reset" title="Atur ulang filter" aria-label="Atur ulang filter"><i class="bi bi-arrow-counterclockwise"></i></button>
      </div>
    </form>

    <div id="info" class="text-muted small mb-3" aria-live="polite"></div>

    <div class="row g-4">
      <div class="col-lg-6 col-xl-5">
        <h2 class="h5 fw-bold">Rekap per Kategori</h2>
        <table class="table table-bordered tabel-rekap">
          <thead><tr><th>Kategori</th><th>Jumlah</th></tr></thead>
          <tbody id="isiKategori"></tbody>
          <tfoot><tr><td>Total</td><td id="totalKategori">0</td></tr></tfoot>
        </table>
      </div>
      <div class="col-lg-6 col-xl-5">
        <h2 class="h5 fw-bold">Rekap per Status</h2>
        <table class="table table-bordered tabel-rekap">
          <thead><tr><th>Status</th><th>Jumlah</th></tr></thead>
          <tbody id="isiStatus"></tbody>
          <tfoot><tr><td>Total</td><td id="totalStatus">0</td></tr></tfoot>
        </table>
      </div>
    </div>

    
  </main>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>


</script>
</body>
</html>
